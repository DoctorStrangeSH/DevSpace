name: DevSpace checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-tests:
    name: Node regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run regression tests
        run: node --test tests/safety.test.cjs

  firestore-rules:
    name: Firestore rules emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator test dependencies
        run: npm install --no-save --package-lock=false firebase-tools @firebase/rules-unit-testing firebase
      - name: Run rules tests against local emulator only
        run: npx firebase emulators:exec --only firestore --project demo-devspace-rules 'node --test tests/firestore.rules.test.cjs'
